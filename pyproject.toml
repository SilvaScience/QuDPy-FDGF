[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qudpy-fdgf"
dynamic = ["version"]
description = "Computing ultrafast nonlinear optical responses using frequency-domain Green's functions"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Needed by the example notebooks: QuTiP builds the physical operators,
# while ufss.DiagramGenerator generates the fifth-order pathways.
examples = ["ufss", "ipython", "ipykernel", "qutip"]
# Needed to run the analysis and benchmark notebooks and scripts of validation/
# (psutil measures memory; nbformat and nbclient execute notebooks from the command line).
validation = ["ufss", "ipython", "ipykernel", "qutip", "psutil", "nbformat", "nbclient"]
# Only the qudpy_fdgf.experimental tensor-network modules import tenpy.
manybody = ["physics-tenpy"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/SilvaScience/QuDPy-FDGF"

[tool.setuptools.dynamic]
version = { attr = "qudpy_fdgf.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# tests/api: contracts and options of the library; tests/physics: closed-form and limiting-case
# checks; tests/consistency: local checks against validation/ (not distributed).
testpaths = ["tests"]
pythonpath = ["tests", "validation"]
markers = ["slow: takes more than a few seconds (deselect with -m 'not slow')"]
